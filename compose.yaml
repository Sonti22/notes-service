services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:${APP_PORT:-8080}
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/database.sqlite
      CACHE_STORE: file
      SESSION_DRIVER: file
      LOG_CHANNEL: stderr
    volumes:
      - notes-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  notes-data:
